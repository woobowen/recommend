hydra:
  run:
    dir: /home/jcyin/Tiger/experiments/04_tiger_smoke/beauty2
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${id}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${task_name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/jcyin/Tiger/experiments/04_tiger_smoke/beauty2
    - hydra.mode=RUN
    task:
    - experiment=tiger_train_flat
    - data_dir=/home/jcyin/Tiger/data/amazon_data/beauty
    - semantic_id_path=/home/jcyin/Tiger/artifacts/beauty/semantic_ids.pt
    - num_hierarchies=4
    - sequence_length=30
    - seed=42
    - train=true
    - test=false
    - trainer.accelerator=gpu
    - trainer.devices=1
    - trainer.max_steps=20
    - trainer.val_check_interval=10
    - +trainer.limit_val_batches=1
    - data_loading.train_dataloader_config.dataloader.batch_size_per_device=2
    - data_loading.train_dataloader_config.dataloader.num_workers=0
    - data_loading.train_dataloader_config.dataloader.timeout=0
    - data_loading.val_dataloader_config.dataloader.batch_size_per_device=2
    - data_loading.val_dataloader_config.dataloader.num_workers=0
    - data_loading.val_dataloader_config.dataloader.timeout=0
    - paths.root_dir=/home/jcyin/Tiger/repos/GRID
    - paths.data_dir=/home/jcyin/Tiger/data/amazon_data/beauty
    - ++should_skip_retry=True
  job:
    name: train
    chdir: null
    override_dirname: ++should_skip_retry=True,+trainer.limit_val_batches=1,data_dir=/home/jcyin/Tiger/data/amazon_data/beauty,data_loading.train_dataloader_config.dataloader.batch_size_per_device=2,data_loading.train_dataloader_config.dataloader.num_workers=0,data_loading.train_dataloader_config.dataloader.timeout=0,data_loading.val_dataloader_config.dataloader.batch_size_per_device=2,data_loading.val_dataloader_config.dataloader.num_workers=0,data_loading.val_dataloader_config.dataloader.timeout=0,experiment=tiger_train_flat,num_hierarchies=4,paths.data_dir=/home/jcyin/Tiger/data/amazon_data/beauty,paths.root_dir=/home/jcyin/Tiger/repos/GRID,seed=42,semantic_id_path=/home/jcyin/Tiger/artifacts/beauty/semantic_ids.pt,sequence_length=30,test=false,train=true,trainer.accelerator=gpu,trainer.devices=1,trainer.max_steps=20,trainer.val_check_interval=10
    id: ???
    num: ???
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/jcyin/Tiger/repos/GRID
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jcyin/Tiger/repos/GRID/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/jcyin/Tiger/experiments/04_tiger_smoke/beauty2
    choices:
      experiment: tiger_train_flat
      eval: null
      optim: null
      loss: null
      hydra: default
      extras: default
      paths: default
      trainer: default
      logger: csv
      callbacks: default
      model: null
      data_loading: null
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
